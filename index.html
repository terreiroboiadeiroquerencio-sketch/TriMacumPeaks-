<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TriPeaks da Macumba - Paciência Mística</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body {
            background-color: #0b131f;
            color: #f3f4f6;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            background: #111827;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #d4af37;
            width: 100%;
            max-width: 420px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
        }
        h1 { color: #d4af37; margin: 0; font-size: 0.85rem; text-transform: uppercase; }
        p.subtitle { color: #10b981; font-size: 0.62rem; margin: 2px 0 0 0; font-weight: bold; }

        .btn-audio {
            background: #1f2937;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .game-panel {
            background: #111827;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            background: #1f2937;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .mentor-dialogue {
            background: #1f2937;
            border: 1px dashed #10b981;
            color: #10b981;
            padding: 6px 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 0.72rem;
            text-align: center;
            margin-bottom: 8px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            height: 360px;
        }

        canvas {
            border: 2px solid #374151;
            background: #0f4c3a;
            border-radius: 6px;
            display: block;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 31, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
        }
        .hidden { display: none !important; }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background: #1f2937;
            border: 1px solid #d4af37;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn-action {
            background: #10b981;
            color: #0b131f;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-action:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-left">
            <img src="https://i.ibb.co/60wpJ3xG/Logo-terreiro.jpg" class="header-logo" alt="Logo">
            <div>
                <h1>TriPeaks da Macumba</h1>
                <p class="subtitle">Paciência dos Três Picos</p>
            </div>
        </div>
        <button class="btn-audio" id="audioToggleBtn" onclick="toggleAudio()">🔊 Som</button>
    </div>

    <div class="game-panel">
        
        <!-- TELA DE ENTRADA -->
        <div id="startScreen" class="overlay-screen">
            <h2 style="color: #d4af37; margin: 0 0 4px 0; font-size: 1.1rem;">Boas-Vindas ao Terreiro</h2>
            <p style="font-size: 0.72rem; color: #9ca3af; margin-bottom: 14px;">Identifique-se e escolha seu Guia Protetor para a jornada:</p>
            
            <label style="font-size: 0.75rem; color: #d4af37; text-align: left; width: 100%;">Seu Nome ou Apelido:</label>
            <input type="text" id="playerNameInput" placeholder="Ex: Pai/Mãe de Santo ou Apelido" value="">

            <label style="font-size: 0.75rem; color: #d4af37; text-align: left; width: 100%;">Escolha seu Mentor(a):</label>
            <select id="mentorSelect">
                <option value="Boiadeiro">Seu Boiadeiro (Foco e Firmeza)</option>
                <option value="Exu">Exu / Pombo Gira (Estratégia e Caminhos)</option>
                <option value="PretoVelho">Pai João / Preta Velha (Paciência e Sabedoria)</option>
                <option value="Cigana">Mãe Cigana (Intuição e Sorte)</option>
                <option value="Caboclo">Caboclo das Matas (Visão e Precisão)</option>
            </select>

            <button class="btn-action" onclick="startGame()">Entrar na Roda 🃏</button>
        </div>

        <!-- TELA DE FIM DE JOGO -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <h2 id="endTitle" style="color: #d4af37; margin: 0; font-size: 1.2rem;">Fim de Jogo 🏆</h2>
            <p id="endText" style="font-size: 0.82rem; color: #f3f4f6; margin: 12px 0; line-height: 1.4;"></p>
            <button class="btn-action" onclick="resetToMenu()">Jogar Novamente</button>
        </div>

        <div class="stats-bar">
            <span>Jogador: <strong id="uiPlayerName" style="color:#10b981;">-</strong></span>
            <span>Pts: <strong id="uiScore" style="color:#fff;">0</strong></span>
            <span>Streak: <strong id="uiStreak" style="color:#f59e0b;">0x</strong></span>
            <span>Recorde: <strong id="uiHighScore" style="color:#a855f7;">0</strong></span>
        </div>

        <div class="mentor-dialogue" id="mentorDialogue">
            💬 Salve Aruanda! Escolha uma carta da mesa para iniciar.
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="360"></canvas>
        </div>
    </div>

    <script>
        let playerName = "Filho(a) de Fé";
        let mentorKey = "Boiadeiro";
        let score = 0;
        let highScore = localStorage.getItem('tripeaks_highscore') || 0;
        let streak = 0;
        let gameActive = false;

        let tableCards = [];
        let wasteCard = null;
        let stockCards = [];
        let idleTimer = 0;
        let hintedCardId = null;

        // Pré-carregamento da Logo para as Costas da Carta
        const logoImg = new Image();
        logoImg.crossOrigin = "anonymous";
        logoImg.src = "https://i.ibb.co/60wpJ3xG/Logo-terreiro.jpg";

        const mentorQuotes = {
            Boiadeiro: {
                start: "Boiadeiro diz: 'Firmo o passo na estrada, vamos tocar essa boiada de cartas!'",
                hint: "Boiadeiro diz: 'Olha o laço, compadre! Joga essa carta aqui!'",
                noMoves: "Boiadeiro diz: 'A cerca fechou! Puxa uma carta do monte para abrir a porteira.'",
                streak6: "Boiadeiro diz: 'Ê boi! Seis seguidas na porteira, que tiro certeiro!'",
                win: "Boiadeiro diz: 'Boiada limpa! Vitória garantida no terreiro!'"
            },
            Exu: {
                start: "Exu diz: 'Laroyê! Vamos abrir os caminhos dessa mesa com sabedoria.'",
                hint: "Exu diz: 'O caminho está livre por aqui, abra os olhos.'",
                noMoves: "Exu diz: 'Os caminhos fecharam momentaneamente. Compre do monte.'",
                streak6: "Exu diz: 'É derramamento de Axé! Seis seguidas sem errar o passo! Odara!'",
                win: "Exu diz: 'Caminhos abertos e coroados. Salve a sua banda!'"
            },
            PretoVelho: {
                start: "Pai João diz: 'Senta aqui no banquinho, meu filho. A pressa é inimiga da perfeição.'",
                hint: "PretoVelho diz: 'Olha com calma, meu filho, esta cartinha serve.'",
                noMoves: "PretoVelho diz: 'Minhas dores... O monte tem a resposta, puxa uma de lá.'",
                streak6: "PretoVelho diz: 'Ora, louvado seja Deus! Seis seguidas, que benção bonita!'",
                win: "PretoVelho diz: 'Descansa a mente, o serviço foi bem feito.'"
            },
            Cigana: {
                start: "Mãe Cigana diz: '🔮 Baralho na mesa, a sorte sorri para quem tem fé!'",
                hint: "Cigana diz: 'As cartas me segredam que esta é a jogada certa.'",
                noMoves: "Cigana diz: 'A sorte está dormindo no monte, vire uma carta para acordá-la.'",
                streak6: "Cigana diz: '✨ Maravilha de ouro! Seis seguidas, a prosperidade é sua!'",
                win: "Cigana diz: 'Que o brilho do ouro e das estrelas acompanhe sua vitória!'"
            },
            Caboclo: {
                start: "Caboclo diz: 'Okê Arô! Olhos de águia na floresta de cartas.'",
                hint: "Caboclo diz: 'Flecha certeira! Jogue esta carta.'",
                noMoves: "Caboclo diz: 'A mata fechou a visibilidade. Chame o vento do monte puxando uma carta.'",
                streak6: "Caboclo diz: 'Okê Arô! Seis flechas certeiras no alvo! Axé poderoso!'",
                win: "Caboclo diz: 'Vitória na mata sagrada! Salve os caboclos de Aruanda!'"
            }
        };

        function setMentorMessage(text) {
            document.getElementById('mentorDialogue').innerText = text;
        }

        function startGame() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            if (nameInput) playerName = nameInput;
            mentorKey = document.getElementById('mentorSelect').value;

            document.getElementById('uiPlayerName').innerText = playerName;
            document.getElementById('uiHighScore').innerText = highScore;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            initAudio();
            initGameData();
            gameActive = true;
            setMentorMessage(mentorQuotes[mentorKey].start);
            requestAnimationFrame(gameLoop);
        }

        function resetToMenu() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            gameActive = false;
        }

        // ÁUDIO SINTETIZADO
        let audioCtx = null;
        let audioMuted = false;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function toggleAudio() {
            audioMuted = !audioMuted;
            document.getElementById('audioToggleBtn').innerHTML = audioMuted ? '🔇 Mudo' : '🔊 Som';
        }
        function playSound(type) {
            if (audioMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'card') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'stock') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'win') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.15); osc.frequency.setValueAtTime(659, now + 0.3);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        // CRIAR BARALHO E DISPOSIÇÃO DO TRIPEAKS
        function initGameData() {
            score = 0;
            streak = 0;
            idleTimer = 0;
            hintedCardId = null;
            updateUI();

            let fullDeck = [];
            const suits = ['♠', '♥', '♦', '♣'];
            for (let s of suits) {
                for (let v = 1; v <= 13; v++) {
                    fullDeck.push({ suit: s, val: v, faceUp: false });
                }
            }
            fullDeck.sort(() => Math.random() - 0.5);

            // Definição dos 28 nós do TriPeaks com conexões de cobrimento (children)
            // Estrutura das 4 linhas:
            // L0: 3 cartas (indices 0, 1, 2)
            // L1: 6 cartas (indices 3..8)
            // L2: 9 cartas (indices 9..17)
            // L3: 10 cartas (indices 18..27 - Base)

            tableCards = [];

            // Layout de coordenadas ajustado perfeitamente para Canvas de 400px de largura
            const positions = [
                // Linha 0 (3 picos)
                { x: 62, y: 15, row: 0, children: [3, 4] },
                { x: 180, y: 15, row: 0, children: [5, 6] },
                { x: 298, y: 15, row: 0, children: [7, 8] },

                // Linha 1 (6 cartas)
                { x: 42, y: 55, row: 1, children: [9, 10] },
                { x: 82, y: 55, row: 1, children: [10, 11] },
                { x: 160, y: 55, row: 1, children: [12, 13] },
                { x: 200, y: 55, row: 1, children: [13, 14] },
                { x: 278, y: 55, row: 1, children: [15, 16] },
                { x: 318, y: 55, row: 1, children: [16, 17] },

                // Linha 2 (9 cartas)
                { x: 22, y: 95, row: 2, children: [18, 19] },
                { x: 62, y: 95, row: 2, children: [19, 20] },
                { x: 102, y: 95, row: 2, children: [20, 21] },
                { x: 140, y: 95, row: 2, children: [21, 22] },
                { x: 180, y: 95, row: 2, children: [22, 23] },
                { x: 220, y: 95, row: 2, children: [23, 24] },
                { x: 258, y: 95, row: 2, children: [24, 25] },
                { x: 298, y: 95, row: 2, children: [25, 26] },
                { x: 338, y: 95, row: 2, children: [26, 27] },

                // Linha 3 (10 cartas - Base)
                { x: 8, y: 135, row: 3, children: [] },
                { x: 46, y: 135, row: 3, children: [] },
                { x: 84, y: 135, row: 3, children: [] },
                { x: 122, y: 135, row: 3, children: [] },
                { x: 160, y: 135, row: 3, children: [] },
                { x: 198, y: 135, row: 3, children: [] },
                { x: 236, y: 135, row: 3, children: [] },
                { x: 274, y: 135, row: 3, children: [] },
                { x: 312, y: 135, row: 3, children: [] },
                { x: 350, y: 135, row: 3, children: [] }
            ];

            for (let i = 0; i < 28; i++) {
                let card = fullDeck[i];
                card.id = i;
                card.x = positions[i].x;
                card.y = positions[i].y;
                card.row = positions[i].row;
                card.children = positions[i].children;
                card.faceUp = (card.row === 3); // Apenas a base começa virada
                tableCards.push(card);
            }

            wasteCard = fullDeck[28];
            wasteCard.faceUp = true;
            stockCards = fullDeck.slice(29);

            updateCardVisibilities();
        }

        // UMA CARTA SÓ É DESBLOQUEADA SE TODAS AS SUAS CARTAS FILHAS (Abaixo) JÁ FORAM REMOVIDAS
        function updateCardVisibilities() {
            tableCards.forEach(card => {
                if (card.row === 3) {
                    card.faceUp = true;
                } else {
                    // Verifica se ainda existe alguma carta filha cobrindo ela
                    let isCovered = card.children.some(childId => {
                        return tableCards.some(tc => tc.id === childId);
                    });
                    card.faceUp = !isCovered;
                }
            });
        }

        function canPlayCard(card) {
            if (!card || !card.faceUp) return false;
            let v1 = card.val;
            let v2 = wasteCard.val;
            let diff = Math.abs(v1 - v2);
            return diff === 1 || (v1 === 1 && v2 === 13) || (v1 === 13 && v2 === 1);
        }

        function getValidMoves() {
            return tableCards.filter(c => canPlayCard(c));
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cardW = 42;
        const cardH = 62;

        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            idleTimer = 0;
            hintedCardId = null;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // 1. Clique no Monte de Compras (Stock)
            let stockX = 120, stockY = 240;
            if (mouseX >= stockX && mouseX <= stockX + cardW && mouseY >= stockY && mouseY <= stockY + cardH) {
                drawFromStock();
                return;
            }

            // 2. Clique nas cartas da mesa (da frente para trás)
            for (let i = tableCards.length - 1; i >= 0; i--) {
                let card = tableCards[i];
                if (mouseX >= card.x && mouseX <= card.x + cardW && mouseY >= card.y && mouseY <= card.y + cardH) {
                    if (canPlayCard(card)) {
                        playTableCard(i);
                        return;
                    }
                }
            }
        });

        function playTableCard(index) {
            let card = tableCards.splice(index, 1)[0];
            wasteCard = card;
            playSound('card');

            streak++;
            let earned = streak * 10;
            score += earned;

            updateCardVisibilities();
            checkGameState();

            if (streak === 6) {
                setMentorMessage(mentorQuotes[mentorKey].streak6);
            } else if (streak > 1) {
                setMentorMessage(`${mentorKey} diz: 'Sequência de ${streak}x! (+${earned} pts)!'`);
            } else {
                setMentorMessage(`${mentorKey} aprova a jogada.`);
            }
            updateUI();
        }

        function drawFromStock() {
            if (stockCards.length === 0) {
                setMentorMessage(`${mentorKey} diz: 'O monte está totalmente vazio!'`);
                return;
            }
            score = Math.max(0, score - 5);
            streak = 0;

            let newCard = stockCards.pop();
            newCard.faceUp = true;
            wasteCard = newCard;
            playSound('stock');
            setMentorMessage(`${mentorKey} diz: 'Carta puxada do monte. (-5 pts).'`);
            
            checkGameState();
            updateUI();
        }

        function checkGameState() {
            if (tableCards.length === 0) {
                gameActive = false;
                playSound('win');
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tripeaks_highscore', highScore);
                }
                document.getElementById('endTitle').innerText = "Vitória Gloriosa! 🏆";
                document.getElementById('endText').innerHTML = `Parabéns, <strong>${playerName}</strong>!<br>Você limpou todos os picos de Aruanda!<br><br>Pontuação Final: <strong>${score} pts</strong>`;
                document.getElementById('gameOverScreen').classList.remove('hidden');
                setMentorMessage(mentorQuotes[mentorKey].win);
                return;
            }

            let valid = getValidMoves();
            if (valid.length === 0 && stockCards.length === 0) {
                gameActive = false;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tripeaks_highscore', highScore);
                }
                document.getElementById('endTitle').innerText = "Fim da Linha 🌿";
                document.getElementById('endText').innerHTML = `As cartas fecharam os caminhos, <strong>${playerName}</strong>.<br>Não há mais jogadas possíveis nem cartas no monte.<br><br>Pontuação: <strong>${score} pts</strong>`;
                document.getElementById('gameOverScreen').classList.remove('hidden');
                setMentorMessage(`${mentorKey} diz: 'As voltas que o mundo dá... Tente novamente!'`);
            } else if (valid.length === 0) {
                setMentorMessage(mentorQuotes[mentorKey].noMoves);
            }
        }

        function updateUI() {
            document.getElementById('uiScore').innerText = score;
            document.getElementById('uiStreak').innerText = streak + 'x';
            document.getElementById('uiHighScore').innerText = highScore;
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!gameActive) return;

            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            idleTimer += dt;
            if (idleTimer > 8000 && !hintedCardId) {
                let valid = getValidMoves();
                if (valid.length > 0) {
                    let hintCard = valid[Math.floor(Math.random() * valid.length)];
                    hintedCardId = hintCard.id;
                    setMentorMessage(mentorQuotes[mentorKey].hint);
                }
                idleTimer = 0;
            }

            renderCanvas();
            requestAnimationFrame(gameLoop);
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Cartas da Mesa
            tableCards.forEach(card => {
                drawCard(card, card.x, card.y, card.id === hintedCardId);
            });

            // Posição centralizada para o Monte (Stock) e Base (Waste)
            let stockX = 120, stockY = 240;
            let wasteX = 238, wasteY = 240;

            // Monte (Stock)
            if (stockCards.length > 0) {
                drawCardBack(stockX, stockY, stockCards.length);
            } else {
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.3)';
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(stockX, stockY, cardW, cardH);
                ctx.setLineDash([]);
            }

            // Carta de Descarte (Waste)
            if (wasteCard) {
                drawCard(wasteCard, wasteX, wasteY, false);
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Base Atual", wasteX + cardW / 2, wasteY - 4);
            }
        }

        // Desenhar Carta de Frente
        function drawCard(card, x, y, isHinted) {
            ctx.save();
            if (card.faceUp) {
                ctx.fillStyle = isHinted ? '#fef08a' : '#ffffff';
                ctx.fillRect(x, y, cardW, cardH);
                
                ctx.strokeStyle = isHinted ? '#eab308' : '#374151';
                ctx.lineWidth = isHinted ? 3 : 1.5;
                ctx.strokeRect(x, y, cardW, cardH);

                let isRed = (card.suit === '♥' || card.suit === '♦');
                ctx.fillStyle = isRed ? '#dc2626' : '#111827';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'left';

                let valStr = card.val === 1 ? 'A' : (card.val === 11 ? 'J' : (card.val === 12 ? 'Q' : (card.val === 13 ? 'K' : card.val)));
                
                ctx.fillText(valStr, x + 4, y + 14);
                ctx.font = '11px sans-serif';
                ctx.fillText(card.suit, x + 4, y + 26);

                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(card.suit, x + cardW / 2, y + cardH / 2 + 6);
            } else {
                drawCardBack(x, y, null);
            }
            ctx.restore();
        }

        // Desenhar Verso da Carta com a LOGO DO TERREIRO
        function drawCardBack(x, y, countLabel) {
            ctx.save();
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(x, y, cardW, cardH);

            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, cardW, cardH);

            // Desenhar Imagem da Logo no centro do verso
            if (logoImg.complete && logoImg.naturalWidth > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x + cardW / 2, y + cardH / 2 - (countLabel !== null ? 4 : 0), 14, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(logoImg, x + cardW / 2 - 14, y + cardH / 2 - 14 - (countLabel !== null ? 4 : 0), 28, 28);
                ctx.restore();
                
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x + cardW / 2, y + cardH / 2 - (countLabel !== null ? 4 : 0), 14, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#d4af37';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🎴', x + cardW / 2, y + cardH / 2 + 4);
            }

            if (countLabel !== null) {
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Monte (${countLabel})`, x + cardW / 2, y + cardH - 4);
            }
            ctx.restore();
        }
    </script>
</body>
</html>
